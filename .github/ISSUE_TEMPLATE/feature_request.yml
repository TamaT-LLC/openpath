name: Feature request
description: 解決したい問題と受け入れ条件を提案する
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        実装方法だけでなく、現在困っていることと、完了を判断できる条件を記載してください。
        security vulnerability は、この Issue ではなく [private vulnerability report](https://github.com/TamaT-LLC/openpath/security/advisories/new) から報告してください。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: どのアプリのどのダイアログで、何ができずに困っているかを記載してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する動作
      description: キー操作、パレットの表示、設定のキーなど、利用者から見た動作を記載してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 現在の回避策や、採用しなかった案があれば記載してください。

  - type: textarea
    id: privacy
    attributes:
      label: 権限、privacy、security への影響
      description: 新しい権限、ネットワーク通信、子プロセス、クリップボード、ログに残す内容、保存するデータへの影響を記載してください。
      placeholder: 影響なし。新しい権限は不要で、通信もしない。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 実装の完了を確かめられる条件を箇条書きで記載してください。
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 確認事項
      options:
        - label: 既存の Issue と README を確認しました。
          required: true
        - label: 公開したくないパス、ユーザー名、credential を含めていません。
          required: true
