name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "preview-v*"

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      version: ${{ steps.metadata.outputs.version }}
      preview_number: ${{ steps.metadata.outputs.preview_number }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and release tag
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            python3 scripts/release_metadata.py --smoke >> "${GITHUB_OUTPUT}"
          else
            # checkout が annotated tag を commit に置換しても、正本の tag object を検証する。
            # private repository でも fetch できるよう、このコマンドにだけ認証を渡す。
            auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
            echo "::add-mask::${auth}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              fetch --force --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            python3 scripts/release_metadata.py --tag "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          fi

  package:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Test release gates
        run: python3 scripts/release_ci_test.py

      - name: Test
        run: |
          ./scripts/test.sh 2>&1 | tee "${RUNNER_TEMP}/swift-test.log"
          grep -Eq 'Test run with [1-9][0-9]* tests?' "${RUNNER_TEMP}/swift-test.log"

      - name: Prepare signing and notarization
        if: needs.prepare.outputs.channel == 'stable'
        env:
          OPENPATH_SIGN_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          OPENPATH_NOTARY_PROFILE: openpath-ci
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_PRIVATE_KEY_BASE64 APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID APPLE_TEAM_ID OPENPATH_SIGN_IDENTITY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is not configured"
              exit 1
            fi
          done
          umask 077
          credential_dir="${RUNNER_TEMP}/openpath-signing"
          mkdir "${credential_dir}"
          keychain="${credential_dir}/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::${keychain_password}"
          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${credential_dir}/certificate.p12"
          printf '%s' "${APPLE_NOTARY_PRIVATE_KEY_BASE64}" | base64 --decode > "${credential_dir}/AuthKey.p8"
          security list-keychains -d user > "${credential_dir}/original-keychains.txt"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 7200 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${credential_dir}/certificate.p12" -k "${keychain}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          curl --fail --silent --show-error --retry 3 \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "${credential_dir}/DeveloperIDG2CA.cer"
          security import "${credential_dir}/DeveloperIDG2CA.cer" -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain}" > /dev/null
          python3 - "${credential_dir}/original-keychains.txt" "${keychain}" <<'PY'
          import pathlib, shlex, subprocess, sys
          original = shlex.split(pathlib.Path(sys.argv[1]).read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', sys.argv[2], *original], check=True)
          PY
          security find-identity -v -p codesigning "${keychain}" | grep -F "\"${OPENPATH_SIGN_IDENTITY}\""
          xcrun notarytool store-credentials "${OPENPATH_NOTARY_PROFILE}" \
            --key "${credential_dir}/AuthKey.p8" --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}" --keychain "${keychain}"
          rm "${credential_dir}/certificate.p12" "${credential_dir}/AuthKey.p8"

      - name: Package smoke or preview
        if: needs.prepare.outputs.channel != 'stable'
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PREVIEW_NUMBER: ${{ needs.prepare.outputs.preview_number }}
        run: ./scripts/package_release.sh "${RELEASE_CHANNEL}" "${RELEASE_VERSION}" "${PREVIEW_NUMBER}"

      - name: Package signed and notarized stable
        if: needs.prepare.outputs.channel == 'stable'
        env:
          OPENPATH_SIGN_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          OPENPATH_NOTARY_PROFILE: openpath-ci
          OPENPATH_NOTARY_KEYCHAIN: ${{ runner.temp }}/openpath-signing/signing.keychain-db
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/package_release.sh stable "${RELEASE_VERSION}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openpath-${{ needs.prepare.outputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

      - name: Remove signing credentials
        if: always() && needs.prepare.outputs.channel == 'stable'
        run: |
          credential_dir="${RUNNER_TEMP}/openpath-signing"
          cleanup_status=0
          if [[ -f "${credential_dir}/original-keychains.txt" ]]; then
            python3 - "${credential_dir}/original-keychains.txt" <<'PY' || cleanup_status=1
          import pathlib, shlex, subprocess, sys
          original = shlex.split(pathlib.Path(sys.argv[1]).read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *original], check=True)
          PY
          fi
          if [[ -f "${credential_dir}/signing.keychain-db" ]]; then
            security delete-keychain "${credential_dir}/signing.keychain-db" || cleanup_status=1
          fi
          rm -rf "${credential_dir}" || cleanup_status=1
          exit "${cleanup_status}"

  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.channel == 'preview' || needs.prepare.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openpath-${{ needs.prepare.outputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py --repo "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" --directory dist
