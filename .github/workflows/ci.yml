name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じ PR / ブランチへの連続 push では古い実行を止める
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # 明示すると -o pipefail 付きで実行され、パイプ途中の失敗も検出できる
    shell: bash

jobs:
  # Actions の SHA 固定と、.github/settings-desired-v1.json の必須チェックが CI の job 名と
  # 一致することを確かめる（CONTRIBUTING.md「GitHub Actions を変える場合」）
  repository-policy:
    name: repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test repository policy checks
        run: python3 scripts/github_policy_test.py

      - name: Verify Actions pins and desired settings
        run: python3 scripts/github_policy_check.py

  build-and-test:
    name: swift build / swift test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # swift-tools-version 6.0 と Swift Testing を使うため Xcode 16 以上が必要。
      # runner の既定 Xcode が変わっても結果が揺れないよう、バージョンを明示する。
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { v = $2 } /^Build version/ { b = $3 } END { print v "-" b }')"
          echo "xcode-version=${xcode_version}" >> "$GITHUB_OUTPUT"

      - name: Cache .build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # SwiftPM は Info.plist の変更を追跡しない（Package.swift のコメント参照）ため、
          # 古いキャッシュで再リンクされない事態を避けるよう Info.plist もキーに含める
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.toolchain.outputs.xcode-version }}-spm-${{ hashFiles('Package.swift', 'Package.resolved', 'Resources/Info.plist') }}

      - name: Test release gates
        run: python3 scripts/release_ci_test.py

      - name: Build
        run: swift build

      - name: Test
        run: |
          log_file="${RUNNER_TEMP}/swift-test.log"
          swift test 2>&1 | tee "${log_file}"
          # Swift Testing が見つからないとテスト 0 件のまま成功扱いになり得るため、
          # 1 件以上実行されたことを確認する
          if ! grep -Eq 'Test run with [1-9][0-9]* tests?' "${log_file}"; then
            echo "::error::Swift Testing のテストが 1 件も実行されませんでした"
            exit 1
          fi
